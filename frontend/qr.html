<!DOCTYPE html>
<html>
<head>
    <title>My QR Pass</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="form" style="width: 350px; margin-top: 50px;">
        <h2>Entry Pass</h2>
        <p>Show this code at the event entrance</p>
        
        <!-- The image container -->
        <div style="background: white; padding: 10px; border-radius: 8px; display: inline-block; margin: 20px 0;">
            <img id="qrImage" src="" alt="Loading QR Code..." style="width: 200px; height: 200px;">
        </div>

        <h3 id="displayUsername" style="color: #2563eb; margin-bottom: 5px;"></h3>
        <p id="displayUserId" style="font-size: 0.8rem; color: #94a3b8;"></p>

        <br>
        <button onclick="window.location.href='dashboard.html'">Back to Dashboard</button>
        <br><br>
        <button onclick="window.print()" style="background: #334155;">Print Pass</button>
    </div>

    <script src="js/qr.js"></script>
</body>
</html>
