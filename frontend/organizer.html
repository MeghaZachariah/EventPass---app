<!DOCTYPE html>
<html>
<head>
    <title>Organizer Panel</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h2>Create New Event</h2>
    <form id="eventForm">
        <input type="text" id="title" placeholder="Event Title" required>
        <input type="date" id="date" required>
        <input type="text" id="location" placeholder="Location (e.g., Lab A)" required>
        <input type="number" id="capacity" placeholder="Capacity" required>
        <button type="submit">Create Event</button>
    </form>

    <br>
    <a href="dashboard.html" style="color: white;">View All Events</a>

    <script src="js/organizer.js"></script>
</body>
</html>
